<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>快速诊断 - OptionAlpha</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .status {
            padding: 20px;
            margin: 10px 0;
            border-radius: 8px;
            font-size: 18px;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }
        .loading {
            background: #fff3cd;
            color: #856404;
            border: 2px solid #ffeaa7;
        }
        pre {
            background: white;
            padding: 15px;
            border-radius: 4px;
            overflow: auto;
            max-height: 400px;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 5px;
        }
        button:hover {
            background: #5568d3;
        }
    </style>
</head>
<body>
    <h1>🔍 前端连接诊断</h1>

    <div id="status" class="status loading">正在检测...</div>
    <pre id="result"></pre>

    <div style="margin-top: 20px;">
        <button onclick="testAPI()">重新测试</button>
        <button onclick="window.open('/frontend.html')">打开主控台</button>
        <button onclick="window.open('/opportunity_radar.html')">打开机会雷达</button>
    </div>

    <script>
        const statusEl = document.getElementById('status');
        const resultEl = document.getElementById('result');

        async function testAPI() {
            statusEl.className = 'status loading';
            statusEl.textContent = '🔄 正在测试API连接...';
            resultEl.textContent = '';

            const tests = [];

            try {
                // 测试1: 健康检查
                const healthRes = await fetch('http://localhost:8001/health');
                const healthData = await healthRes.json();
                tests.push({
                    name: '✅ 健康检查',
                    status: 'success',
                    data: healthData
                });

                // 测试2: 机会雷达统计
                const statsRes = await fetch('http://localhost:8001/api/v1/comprehensive/stats');
                const statsData = await statsRes.json();
                tests.push({
                    name: '✅ 机会雷达统计API',
                    status: 'success',
                    data: statsData.stats
                });

                // 测试3: 虚实比汇总
                const vrrRes = await fetch('http://localhost:8001/api/v1/virtual-real-ratio/summary');
                const vrrData = await vrrRes.json();
                tests.push({
                    name: '✅ 虚实比汇总API',
                    status: 'success',
                    data: {
                        total: vrrData.total_varieties,
                        high_risk: vrrData.high_risk_count
                    }
                });

                // 所有测试通过
                statusEl.className = 'status success';
                statusEl.textContent = '✅ 所有API连接正常! 后端服务运行正常。';

                resultEl.textContent = JSON.stringify(tests, null, 2);

            } catch (error) {
                statusEl.className = 'status error';
                statusEl.textContent = '❌ API连接失败: ' + error.message;

                resultEl.textContent = `错误详情:
${error.stack}

可能原因:
1. 后端服务未启动 (检查: curl http://localhost:8001/health)
2. 端口被占用或更改
3. CORS配置问题
4. 网络连接问题

解决方案:
1. 确认后端运行: ps aux | grep uvicorn
2. 查看后端日志
3. 清除浏览器缓存: Cmd+Shift+R (Mac) 或 Ctrl+Shift+R (Windows)
4. 使用无痕模式测试`;
            }
        }

        // 页面加载时自动测试
        testAPI();
    </script>
</body>
</html>
