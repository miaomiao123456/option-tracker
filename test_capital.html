<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>资金面数据测试</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus/dist/index.css" />
    <script src="https://cdn.jsdelivr.net/npm/element-plus"></script>
</head>
<body>
    <div id="app">
        <div style="padding: 20px;">
            <h2>资金面数据测试</h2>
            <button @click="fetchData">加载RB数据</button>

            <div v-if="loading">加载中...</div>

            <div v-if="!loading" style="margin-top: 20px;">
                <h3>多头席位 ({{ longBrokers.length }}条)</h3>
                <table border="1" cellpadding="5">
                    <tr>
                        <th>排名</th>
                        <th>席位名称</th>
                        <th>持仓</th>
                        <th>增减</th>
                    </tr>
                    <tr v-for="(item, index) in longBrokers" :key="index">
                        <td>{{ index + 1 }}</td>
                        <td>{{ item.broker }}</td>
                        <td>{{ item.position }}</td>
                        <td>{{ item.change }}</td>
                    </tr>
                </table>

                <h3 style="margin-top: 20px;">空头席位 ({{ shortBrokers.length }}条)</h3>
                <table border="1" cellpadding="5">
                    <tr>
                        <th>排名</th>
                        <th>席位名称</th>
                        <th>持仓</th>
                        <th>增减</th>
                    </tr>
                    <tr v-for="(item, index) in shortBrokers" :key="index">
                        <td>{{ index + 1 }}</td>
                        <td>{{ item.broker }}</td>
                        <td>{{ item.position }}</td>
                        <td>{{ item.change }}</td>
                    </tr>
                </table>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref } = Vue;

        createApp({
            setup() {
                const longBrokers = ref([]);
                const shortBrokers = ref([]);
                const loading = ref(false);

                const fetchData = async () => {
                    loading.value = true;
                    try {
                        const res = await fetch('http://localhost:8001/api/v1/capital/RB/top-brokers?limit=15');
                        const data = await res.json();
                        console.log('API返回数据:', data);
                        longBrokers.value = data.top_long || [];
                        shortBrokers.value = data.top_short || [];
                    } catch (e) {
                        console.error('获取失败:', e);
                    } finally {
                        loading.value = false;
                    }
                };

                return {
                    longBrokers,
                    shortBrokers,
                    loading,
                    fetchData
                };
            }
        }).use(ElementPlus).mount('#app');
    </script>
</body>
</html>
